name = "lector"
description = "Narrow JSON reading: SPARK-proven targeted scans, utilada parse"
version = "0.1.0"

authors = ["Lenny Maiorani"]
maintainers = ["Lenny Maiorani <639247+ldm5180@users.noreply.github.com>"]
maintainers-logins = ["ldm5180"]
licenses = "MIT"
website = "https://github.com/ldm5180/lector"
tags = ["json", "parser", "scanner", "spark"]

project-files = ["lector.gpr"]

[[depends-on]]
utilada = "^2.9.0"
aunit = "^26.0.0"
fabula = "*"

#  fabula, the Gherkin runner the features under tests/features/ run on,
#  is a TEST dependency and not in the community index; pin it to an
#  exact commit so a build is reproducible from this file alone.  Its own
#  pin brings sml 3ccd0e4 into this crate's closure: lector pins no sml
#  itself, so there is no chain to align here, and a consumer that pins
#  sml (fructus, arb-ada) already pins that same commit.
[[pins]]
fabula = { url = "https://github.com/ldm5180/fabula.git", commit = "746a234df5581c2e38c4202aeee8b07473fb6a51" }

[build-switches]
"*".ada_version = "Ada2022"

#  `alr test` runs actions with an empty GPR_PROJECT_PATH, so each wraps its
#  command in `alr exec --` to pick up the toolchain, utilada and AUnit.
#  Argv-only actions (no `sh -c`, no `&&`) so this runs on Windows too; the
#  runner exits non-zero on any failing assertion, so a failure fails the
#  job.  The suite is built and run in both optimization modes (release -O3,
#  debug -O0), selected by the MODE external (sml-ada convention), so the
#  library is exercised at each -O level.
[[actions]]
type = "test"
command = ["alr", "exec", "--", "gprbuild", "-p", "-j0", "-XMODE=release", "-P", "tests/test_lector.gpr"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "tests/bin/release/test_runner"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "gprbuild", "-p", "-j0", "-XMODE=debug", "-P", "tests/test_lector.gpr"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "tests/bin/debug/test_runner"]
